[project]
name = "daemons-mcp"
version = "0.1.0"
description = "Connect Claude Code to Claude voice mode: a custom connector that lets the Claude app search your sessions and save tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.26,<2", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daemons = "daemons_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daemons_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
