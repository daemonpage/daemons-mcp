[project]
name = "walkie-mcp"
version = "0.1.0"
description = "Talk to your Claude Code from the Claude app: search your sessions by voice, leave tasks for agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.26,<2", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
walkie = "walkie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walkie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
